<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="description" content="ShowArchive — 个人观演记忆档案馆" />
    <title>ShowArchive</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #1a1a2e;
          color: rgba(245, 239, 230, 0.7);
          font-family: Inter, system-ui, sans-serif;
          font-size: 14px;
        "
      >
        正在加载 ShowArchive…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 检测到以文件方式直接打开时，给出明确提示（而不是空白页）。
      (function () {
        if (window.location.protocol === 'file:') {
          var root = document.getElementById('root')
          if (root) {
            root.innerHTML =
              '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;' +
              'background:#1a1a2e;color:#f5efe6;font-family:Inter,system-ui,sans-serif;padding:24px;">' +
              '<div style="max-width:440px;text-align:center;">' +
              '<p style="font-size:0.75rem;letter-spacing:0.2em;color:#e0a458;text-transform:uppercase;">ShowArchive</p>' +
              '<h1 style="font-family:Georgia,serif;font-size:1.5rem;margin:8px 0 12px;">请勿直接双击打开</h1>' +
              '<p style="color:rgba(245,239,230,0.72);font-size:0.9rem;line-height:1.7;">' +
              '这是一个 PWA 应用，需要用本地服务访问。<br/>' +
              '请双击「启动 ShowArchive.command」，或先运行 pnpm dev，' +
              '再在浏览器打开 http://localhost:5173/</p>' +
              '</div></div>'
          }
        }
      })()
    </script>
  </body>
</html>
